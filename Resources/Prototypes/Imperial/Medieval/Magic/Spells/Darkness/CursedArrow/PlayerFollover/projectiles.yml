# Beginner

- type: entity
  id: MedievalProjectileCursedArrowPlayerFolloverBeginner
  parent: MedievalSpellBulletRocket
  name: fireball
  description: You better GITTAH WEIGH.
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Magic/Darkness/CursedArrow/projectiles.rsi
    layers:
    - state: aim
      shader: unshaded
  - type: MedievalStaminaDamageOnCollide
    damage: 3
  - type: Explosive
    explosionType: Cryo
    maxIntensity: 1
    intensitySlope: 1
    totalIntensity: 0
    maxTileBreak: 0
  - type: Projectile
    damage:
      types:
        Blunt: 10
        Bloodloss: 4

