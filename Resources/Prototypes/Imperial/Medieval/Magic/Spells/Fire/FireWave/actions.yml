- type: entity
  id: MedievalActionFireWave
  name: medieval-store-spells-fire-wave-name
  description: medieval-store-spells-fire-wave-desc
  components:
  - type: SpellMemory
    cost: 1
  - type: MedievalTargetSpell
  - type: Action
    useDelay: 60
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Imperial/Medieval/fireball_cast.ogg
    icon:
      sprite: Imperial/Medieval/Magic/Fire/FireWall/icons.rsi
      state: beginner
  - type: TargetAction
    checkCanAccess: false
    range: 60
  - type: WorldTargetAction
    event: !type:MedievalSpawnSpellEvent
      spawnedEntityPrototype: MedievalFireWave
      spawnType: SpawnOnCaster
      targetSpellType: TargetOnCurrentMousePosition
      spellCastDoAfter:
        delay: 2
        breakOnDropItem: false
        breakOnWeightlessMove: false
        breakOnMove: false
        needHand: true
        speedModifier: 0.75
      speechPoints:
        0:
          speech: medieval-spell-speach-fire-wave
          color: "#FF5900"
          hideChat: true
  - type: SpellCastEffect
    effectProto: FireballSpellCastEffectBeginner
  - type: ManaDrainSpell
    manaDrain: 30
  - type: ActionUpgrade
    effectedLevels:
      2: MedievalActionFireWaveMiddle
      3: MedievalActionFireWaveSenior

- type: entity
  id: MedievalActionFireWaveMiddle
