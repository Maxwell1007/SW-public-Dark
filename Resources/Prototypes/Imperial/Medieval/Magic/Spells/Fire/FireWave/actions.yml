        needHand: true
        speedModifier: 0.75
      speechPoints:
        0:
          speech: medieval-spell-speach-fire-wave
          color: "#FF5900"
          hideChat: true
  - type: SpellCastEffect
    effectProto: FireballSpellCastEffectMiddle

