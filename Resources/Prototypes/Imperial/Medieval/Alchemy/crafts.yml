- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMedievalAlchemyApparatusCraft
  components:
  - type: Item
    size: Large
  - type: SpawnAfterInteract
    doAfter: 15
    deleteOnInteract: true
  - type: Sprite
    sprite: Imperial/Medieval/CraftBosses/stone_wall.rsi
    state: icon

- type: entity
  parent: BaseMedievalAlchemyApparatusCraft
  id: MedievalAlchemyWhiskCraft
  name: crushing station construction kit
  description: Use this kit on a clear tile to build a crushing station.
  components:
  - type: SpawnAfterInteract
    prototype: MedievalAlchemyWhisk

