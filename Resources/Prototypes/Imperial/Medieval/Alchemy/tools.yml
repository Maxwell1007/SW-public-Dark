- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseMedievalAlchemyApparatus
  components:
  - type: AlchemyApparatus
  - type: AlchemyVessel
    solution: alchemy_input
  - type: Storage
    grid:
    - 0,0,9,5
    maxItemSize: Huge
    openOnActivate: false
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
      enum.AlchemyUiKey.Key:
        type: AlchemyBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: SolutionContainerManager
    solutions:
      alchemy_input:
        maxVol: 1000000
        canReact: false

- type: entity
  parent: BaseMedievalAlchemyApparatus
  id: MedievalAlchemyWhisk
  name: crushing station
  description: A sturdy station with a pestle for processing alchemical mixtures.
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Chem/whisk.rsi
    state: icon
  - type: AlchemyApparatus
    operation: Whip

- type: entity
  parent: BaseStructure
  id: MedievalAlchemyCool
  name: cooling bath
  description: A bath for gradually cooling alchemical vessels.
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Chem/cooling_bath.rsi
    layers:
    - state: icon
      map: [ "base" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.AlchemyCoolingBathVisuals.IsProcessing:
        base:
          True: { state: cooling }
          False: { state: icon }
  - type: AlchemyCoolingBath
  - type: ActivatableUI
    key: enum.AlchemyCoolingBathUiKey.Key
  - type: Storage
    grid:
    - 0,0,9,5
    maxItemSize: Huge
    openOnActivate: false
  - type: UserInterface
    interfaces:
      enum.AlchemyCoolingBathUiKey.Key:
        type: AlchemyCoolingBathBoundUserInterface
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container

- type: entity
  parent: BaseMedievalAlchemyApparatus
  id: MedievalAlchemyDistill
  name: distillation apparatus
  description: An apparatus for distilling alchemical mixtures.
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Chem/distiller.rsi
    state: icon
  - type: AlchemyApparatus
    operation: Distill

- type: entity
  parent: MedievalAlchemyDistill
  id: MedievalAlchemyRectify
  name: rectifier
  description: An apparatus for rectifying alchemical mixtures.
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Chem/rectifier.rsi
    state: icon
  - type: AlchemyApparatus
    operation: Rectify

- type: entity
  parent: BaseMedievalAlchemyApparatus
  id: MedievalAlchemyExtract
  name: alchemy apparatus
  description: An apparatus for preparing alchemical extracts.
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Chem/extractor.rsi
    state: icon
  - type: AlchemyApparatus
    operation: Extract

- type: entity
  parent: BaseMedievalAlchemyApparatus
  id: MedievalAlchemyFilter
  name: alchemy apparatus
  description: A station for filtering alchemical mixtures.
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Chem/filter.rsi
    state: icon
  - type: AlchemyApparatus
    operation: Filter

- type: entity
  parent: BaseMedievalAlchemyApparatus
  id: MedievalAlchemyInfuse
  name: alchemy apparatus
  description: A station for preparing alchemical infusions.
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Chem/infusion.rsi
    state: icon
  - type: AlchemyApparatus
    operation: Infuse
    outputToInput: true

