- type: entity
  name: magical halberd skeleton
  parent: MedievalMobSkeletBase
  id: MedievalMobSkeletHalberdSpell
  description: A skeleton conjured by dark magic. Its remains leave no loot.
  components:
  - type: MedievalTimedDespawn
    lifetime: 600
  - type: Sprite
    drawdepth: Mobs
    sprite: Imperial/Medieval/Mobs/skelet_halberd.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: base
  - type: MeleeWeapon
    attackRate: 0.4
    damage:
      types:
        Piercing: 12
        Slash: 12
        Structural: 2
        ParryAble: 1
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.7
    baseSprintSpeed: 3.8
  - type: SlowOnDamage
    speedModifierThresholds:
      10: 1
      65: 0.8
      110: 0.7
      135: 0.6
      140: 0.5
  - type: Hands
  - type: ComplexInteraction

