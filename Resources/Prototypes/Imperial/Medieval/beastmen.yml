- type: markingsGroup
  parent: Undergarments
  id: Beastmen
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.HeadTop:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: false

- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceBeastmen
  categories: [ HideSpawnMenu ]
  name: beastmen appearance
  components:
  - type: InitialBody
    organs:
      Head: OrganBeastmenHead
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Torso: OrganBeastmenTorso
      Lungs: OrganHumanLungs
      Heart: OrganBeastmenHeart
      Stomach: OrganBeastmenStomach
      Liver: OrganBeastmenLiver
      Kidneys: OrganHumanKidneys
      ArmLeft: OrganBeastmenArmLeft
      ArmRight: OrganBeastmenArmRight
      HandLeft: OrganBeastmenHandLeft
      HandRight: OrganBeastmenHandRight
      LegLeft: OrganBeastmenLegLeft
      LegRight: OrganBeastmenLegRight
      FootLeft: OrganBeastmenFootLeft
      FootRight: OrganBeastmenFootRight
  - type: HumanoidProfile
    species: Beastmen

- type: entity
  id: OrganBeastmenHeart
  parent: OrganHumanHeart
  name: Beastmen heart
  components:
  - type: Metabolizer
    metabolizerTypes: [Beastmen]

- type: entity
  id: OrganBeastmenLiver
  parent: OrganHumanLiver
  name: Beastmen liver
  components:
  - type: Metabolizer
    metabolizerTypes: [Beastmen]

- type: entity
  id: OrganBeastmenStomach
  parent: OrganHumanStomach
  name: Beastmen stomach
  components:
  - type: Sprite
    state: stomach
  - type: Organ
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 75
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Stomach
  - type: Metabolizer
    # mm very yummy
    maxReagents: 5
    metabolizerTypes: [Beastmen]

- type: metabolizerType
  id: Beastmen
  name: Beastmen

- type: entity
  save: false
  name: Урист МакЗверолюдь
  parent: BaseMobBeastmen
  id: MobBeastmen

- type: entity
  save: false
  name: Urist McHands The Beastmen
  parent: [AppearanceBeastmen, BaseSpeciesMobOrganic]
  id: BaseMobBeastmen
  abstract: true
  components:
  - type: Hunger
  - type: Thirst
  - type: Icon
    sprite: Imperial/Medieval/Species/Slime/parts.rsi # It was like this beforehand, no idea why.
    state: full
  - type: Respirator
    damage:
      types:
        Asphyxiation: 1
    damageRecovery:
      types:
        Asphyxiation: -1
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    #scale: 0.97, 1.03
  - type: Bloodstream
    bloodReagent: BeastmenBlood
  - type: LanguageSpeaker
    languages:
      Common: Speak
      #Goblin: Speak
      #Ancient: Speak
      #Tribe: Understand
      #Orc: Speak
      #Cursed: Speak
      #Growling: Speak
      #Hissing: Speak
      #Elf: Speak
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatHuman
      amount: 6
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        # they r smaller
        density: 150
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
      medieval-spawner: # imperial medieval start
        shape: !type:PhysShapeCircle
          radius: 0.4
        #layer:
        #- DoorPassable
        mask:
        - MedievalSpawnerLayer
        hard: false # imperial medieval end
  - type: Vocal
    sounds:
      Male: MaleHuman
      Female: FemaleHuman
      Unsexed: MaleHuman
  - type: Speech
    speechSounds: Alto
  - type: HumanoidProfile
    species: Beastmen
  - type: Mana
    maxManaRaceModifier: 1.00
    regenRaceModifier: 1.00
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Imperial/Medieval/Species/Beastmen/displacement.rsi
            state: jumpsuit-female
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  - type: NeedSleep
    sleepLevelPerUpdate: 0.27
  - type: StealRaceChanceIncreaser
  - type: TypingIndicator
    proto: wolf

- type: entity
  parent: AppearanceBeastmen
  id: MobBeastmenDummy
  noSpawn: true
  components:
  - type: Sprite
    #scale: 0.97, 1.03
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Imperial/Medieval/Species/Beastmen/displacement.rsi
            state: jumpsuit-female
  - type: MobThresholds
    thresholds:
      0: Alive
      100: Critical
      200: Dead
  - type: Mana
    maxManaRaceModifier: 1.0
    regenRaceModifier: 1.0
  - type: Respirator
    damage:
      types:
        Asphyxiation: 1
    damageRecovery:
      types:
        Asphyxiation: -1

- type: species
  id: Beastmen
  name: Зверолюд
  roundStart: true
  prototype: MobBeastmen
  dollPrototype: AppearanceBeastmen
  skinColoration: HumanToned

